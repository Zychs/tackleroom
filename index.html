<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tools · session management</title>
  <style>
    @font-face {
      font-family: "OpenDyslexic3";
      src: url("/fonts/OpenDyslexic3-Regular.ttf") format("truetype");
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: "OpenDyslexic3";
      src: url("/fonts/OpenDyslexic3-Bold.ttf") format("truetype");
      font-weight: 700; font-style: normal; font-display: swap;
    }
    :root {
      --bg: #070b12; --panel: #140f1c; --line: #4a3a66;
      --text: #eef5ff; --muted: #c4b4d8; --accent: #c9a0ff; --hot: #ff9b5e; --ok: #9adf6a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font: 14px/1.45 "OpenDyslexic3", "Segoe UI", system-ui, sans-serif;
    }
    body { display: flex; flex-direction: column; padding: 10px 12px 14px; gap: 8px; }
    h1 { margin: 0; font-size: 16px; color: var(--accent); }
    .note { color: var(--muted); font-size: 12px; margin: 0; }
    .doors { display: flex; flex-wrap: wrap; gap: 8px; }
    button {
      appearance: none; cursor: pointer;
      border: 1.5px solid rgba(201,160,255,.45); background: #171022;
      color: var(--accent); font: inherit; font-weight: 700; font-size: 13px;
      padding: 7px 12px; border-radius: 8px;
    }
    button:hover { border-color: var(--accent); color: var(--text); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button.warn { color: var(--hot); border-color: rgba(255,155,94,.45); background: #1a120c; }
    pre {
      flex: 1 1 auto; min-height: 0; overflow: auto;
      margin: 0; padding: 8px 10px;
      border: 1px solid var(--line); border-radius: 8px;
      background: var(--panel); color: var(--text);
      font: 12px/1.4 ui-monospace, Consolas, monospace; white-space: pre-wrap;
    }
    .msg { font-size: 12px; color: var(--muted); min-height: 1.2em; }
    .msg.ok { color: var(--ok); }
    .msg.err { color: var(--hot); }
  </style>
</head>
<body>
  <h1>Bulk tooling</h1>
  <p class="note">Local only. No keys. Archive compile never deletes live sessions. Segregate is dry-run unless you confirm. Land copies by default.</p>
  <div class="doors">
    <button type="button" id="status">Refresh status</button>
    <button type="button" id="receipt">Sessions receipt</button>
    <button type="button" id="archive">Run archive compile</button>
    <button type="button" id="seg">Segregate dry-run</button>
    <button type="button" class="warn" id="land">Land capture (copy)</button>
  </div>
  <pre id="out">…</pre>
  <p class="msg" id="msg"></p>
<script>
(function () {
  var out = document.getElementById("out");
  var msg = document.getElementById("msg");

  function say(t, kind) {
    msg.textContent = t || "";
    msg.className = "msg" + (kind ? " " + kind : "");
  }
  function show(j) {
    out.textContent = JSON.stringify(j, null, 2);
  }

  async function get(url) {
    var r = await fetch(url, { cache: "no-store" });
    return r.json();
  }
  async function post(url, body) {
    var r = await fetch(url, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body || {})
    });
    return r.json();
  }

  async function refresh() {
    say("reading…");
    try {
      var a = await get("/api/archive");
      var d = await get("/api/durable-archive");
      show({ archive: a, durable: d });
      say("status loaded", "ok");
    } catch (e) {
      say(String(e), "err");
    }
  }

  document.getElementById("status").addEventListener("click", refresh);
  document.getElementById("receipt").addEventListener("click", async function () {
    say("receipt…");
    try {
      var j = await get("/api/sessions-receipt");
      show(j);
      say("receipt loaded", j && j.ok ? "ok" : "err");
    } catch (e) { say(String(e), "err"); }
  });
  document.getElementById("archive").addEventListener("click", async function () {
    if (!window.confirm("Compile chat diffs into a new archive stamp? Live sessions stay. No delete.")) return;
    say("archive compile…");
    try {
      var j = await post("/api/archive", {});
      show(j);
      say(j && j.ok ? "archive wrote a stamp" : ((j && j.error) || "archive failed"), j && j.ok ? "ok" : "err");
    } catch (e) { say(String(e), "err"); }
  });
  document.getElementById("seg").addEventListener("click", async function () {
    say("segregate dry-run…");
    try {
      var br = await get("/api/archive-browser");
      var stamp = "";
      var batches = (br && br.batches) || (br && br.stamps) || [];
      if (Array.isArray(batches) && batches[0]) {
        stamp = batches[0].stamp || batches[0].id || batches[0] || "";
      }
      if (!stamp && br && br.latest) stamp = br.latest;
      var j = await post("/api/segregate", { stamp: stamp, confirm: false });
      show({ browser: { batch_count: br && br.batch_count, stamp: stamp }, segregate: j });
      say("dry-run only · nothing moved", j && j.ok !== false ? "ok" : "err");
    } catch (e) { say(String(e), "err"); }
  });
  document.getElementById("land").addEventListener("click", async function () {
    if (!window.confirm("Copy files from the capture inbox into a new durable land? Originals stay.")) return;
    say("land copy…");
    try {
      var j = await post("/api/durable-archive/land", { from: "capture", move: false });
      show(j);
      say(j && j.ok ? "land copied" : ((j && j.error) || "land failed"), j && j.ok ? "ok" : "err");
    } catch (e) { say(String(e), "err"); }
  });

  refresh();
})();
</script>
</body>
</html>
